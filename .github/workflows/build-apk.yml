name: Build USE VISION AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App & Initialize Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          rm -f capacitor.config.ts
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.usevision.ai",
              appName: "USE VISION AI",
              webDir: "dist",
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true,
                captureInput: true
              }
            }, null, 2));
          '
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let m = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.BLUETOOTH_CONNECT"
            ].filter(x => !m.includes(x)).map(x => `    <uses-permission android:name="${x}" />`).join("\n");
            if (perms) m = m.replace("<application", perms + "\n    <application");
            if (!m.includes("usesCleartextTraffic")) {
              m = m.replace("<application", "<application\n        android:usesCleartextTraffic=\"true\"");
            }
            fs.writeFileSync(p, m);
          '
          node -e '
            const fs = require("fs");
            const java = [
              "package com.usevision.ai;",
              "",
              "import android.Manifest;",
              "import android.content.Intent;",
              "import android.content.pm.PackageManager;",
              "import android.os.Build;",
              "import android.os.Bundle;",
              "import android.speech.RecognitionListener;",
              "import android.speech.RecognizerIntent;",
              "import android.speech.SpeechRecognizer;",
              "import android.speech.tts.TextToSpeech;",
              "import android.speech.tts.UtteranceProgressListener;",
              "import android.webkit.JavascriptInterface;",
              "import android.webkit.WebSettings;",
              "import android.webkit.WebView;",
              "import androidx.core.app.ActivityCompat;",
              "import androidx.core.content.ContextCompat;",
              "import com.getcapacitor.BridgeActivity;",
              "import java.util.ArrayList;",
              "import java.util.List;",
              "import java.util.Locale;",
              "import org.json.JSONObject;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "    private TextToSpeech tts;",
              "    private boolean ttsReady = false;",
              "    private String pendingText = null;",
              "    private String pendingLang = \"en-US\";",
              "    private float pendingRate = 1.0f;",
              "    private float pendingPitch = 1.05f;",
              "    private SpeechRecognizer speechRecognizer;",
              "",
              "    @Override",
              "    protected void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        tts = new TextToSpeech(this, status -> {",
              "            if (status == TextToSpeech.SUCCESS) {",
              "                ttsReady = true;",
              "                tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {",
              "                    @Override public void onStart(String id) {}",
              "                    @Override public void onDone(String id) { notifyTtsDone(); }",
              "                    @Override public void onError(String id) { notifyTtsDone(); }",
              "                });",
              "                if (pendingText != null) {",
              "                    String t = pendingText;",
              "                    pendingText = null;",
              "                    speakNative(t, pendingLang, pendingRate, pendingPitch);",
              "                }",
              "            }",
              "        });",
              "        if (this.bridge != null && this.bridge.getWebView() != null) {",
              "            WebView wv = this.bridge.getWebView();",
              "            WebSettings ws = wv.getSettings();",
              "            ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);",
              "            ws.setMediaPlaybackRequiresUserGesture(false);",
              "            wv.addJavascriptInterface(new TtsBridge(), \"AndroidTTS\");",
              "            wv.addJavascriptInterface(new SpeechBridge(), \"AndroidSpeech\");",
              "        }",
              "        List<String> perms = new ArrayList<>();",
              "        String[] base = new String[]{",
              "            Manifest.permission.CAMERA,",
              "            Manifest.permission.RECORD_AUDIO,",
              "            Manifest.permission.ACCESS_FINE_LOCATION",
              "        };",
              "        for (String p : base) {",
              "            if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {",
              "                perms.add(p);",
              "            }",
              "        }",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {",
              "            if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_SCAN) != PackageManager.PERMISSION_GRANTED) {",
              "                perms.add(Manifest.permission.BLUETOOTH_SCAN);",
              "            }",
              "            if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {",
              "                perms.add(Manifest.permission.BLUETOOTH_CONNECT);",
              "            }",
              "        }",
              "        if (!perms.isEmpty()) {",
              "            ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), 1001);",
              "        }",
              "    }",
              "",
              "    private void speakNative(String text, String lang, float rate, float pitch) {",
              "        if (!ttsReady || tts == null) {",
              "            pendingText = text;",
              "            pendingLang = lang;",
              "            pendingRate = rate;",
              "            pendingPitch = pitch;",
              "            return;",
              "        }",
              "        Locale loc = (lang != null && lang.toLowerCase().startsWith(\"hi\")) ? new Locale(\"hi\", \"IN\") : Locale.US;",
              "        tts.setLanguage(loc);",
              "        tts.setSpeechRate(Math.max(0.5f, Math.min(2.0f, rate)));",
              "        tts.setPitch(Math.max(0.5f, Math.min(2.0f, pitch)));",
              "        tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, \"uv_\" + System.currentTimeMillis());",
              "    }",
              "",
              "    private void notifyTtsDone() {",
              "        runOnUiThread(() -> {",
              "            if (this.bridge != null && this.bridge.getWebView() != null) {",
              "                this.bridge.getWebView().evaluateJavascript(\"window.__onAndroidTtsDone && window.__onAndroidTtsDone()\", null);",
              "            }",
              "        });",
              "    }",
              "",
              "    private void emitSpeechResult(String text, boolean isFinal) {",
              "        runOnUiThread(() -> {",
              "            if (this.bridge != null && this.bridge.getWebView() != null) {",
              "                String js = \"window.__onAndroidSpeechResult && window.__onAndroidSpeechResult(\" + JSONObject.quote(text) + \", \" + isFinal + \")\";",
              "                this.bridge.getWebView().evaluateJavascript(js, null);",
              "            }",
              "        });",
              "    }",
              "",
              "    private void emitSpeechEnd() {",
              "        runOnUiThread(() -> {",
              "            if (this.bridge != null && this.bridge.getWebView() != null) {",
              "                this.bridge.getWebView().evaluateJavascript(\"window.__onAndroidSpeechEnd && window.__onAndroidSpeechEnd()\", null);",
              "            }",
              "        });",
              "    }",
              "",
              "    class TtsBridge {",
              "        @JavascriptInterface",
              "        public void speak(String text, String lang, float rate, float pitch) {",
              "            runOnUiThread(() -> speakNative(text, lang, rate, pitch));",
              "        }",
              "        @JavascriptInterface",
              "        public void stop() {",
              "            runOnUiThread(() -> { if (tts != null) tts.stop(); });",
              "        }",
              "    }",
              "",
              "    class SpeechBridge {",
              "        @JavascriptInterface",
              "        public void start(String lang) {",
              "            runOnUiThread(() -> {",
              "                try {",
              "                    if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {",
              "                        ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, 1002);",
              "                        emitSpeechEnd();",
              "                        return;",
              "                    }",
              "                    if (speechRecognizer == null && SpeechRecognizer.isRecognitionAvailable(MainActivity.this)) {",
              "                        speechRecognizer = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);",
              "                        speechRecognizer.setRecognitionListener(new RecognitionListener() {",
              "                            @Override public void onReadyForSpeech(Bundle b) {}",
              "                            @Override public void onBeginningOfSpeech() {}",
              "                            @Override public void onRmsChanged(float v) {}",
              "                            @Override public void onBufferReceived(byte[] b) {}",
              "                            @Override public void onEndOfSpeech() {}",
              "                            @Override public void onError(int err) { emitSpeechEnd(); }",
              "                            @Override public void onResults(Bundle res) {",
              "                                ArrayList<String> list = res.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);",
              "                                if (list != null && !list.isEmpty()) emitSpeechResult(list.get(0), true);",
              "                                else emitSpeechEnd();",
              "                            }",
              "                            @Override public void onPartialResults(Bundle res) {",
              "                                ArrayList<String> list = res.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);",
              "                                if (list != null && !list.isEmpty()) emitSpeechResult(list.get(0), false);",
              "                            }",
              "                            @Override public void onEvent(int t, Bundle b) {}",
              "                        });",
              "                    }",
              "                    if (speechRecognizer != null) {",
              "                        Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);",
              "                        i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);",
              "                        i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang != null ? lang : \"en-US\");",
              "                        i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);",
              "                        speechRecognizer.startListening(i);",
              "                    } else {",
              "                        emitSpeechEnd();",
              "                    }",
              "                } catch (Exception e) { emitSpeechEnd(); }",
              "            });",
              "        }",
              "        @JavascriptInterface",
              "        public void stop() {",
              "            runOnUiThread(() -> { if (speechRecognizer != null) speechRecognizer.stopListening(); });",
              "        }",
              "    }",
              "",
              "    @Override",
              "    public void onDestroy() {",
              "        if (tts != null) { tts.stop(); tts.shutdown(); }",
              "        if (speechRecognizer != null) { speechRecognizer.destroy(); }",
              "        super.onDestroy();",
              "    }",
              "}"
            ].join("\n");
            fs.writeFileSync("android/app/src/main/java/com/usevision/ai/MainActivity.java", java);
          '
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_DIR="${{ runner.temp }}/release"
          mkdir -p "$ASSET_DIR"
          ASSET="$ASSET_DIR/use-vision-ai-debug-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "$ASSET" \
            --target "${{ github.sha }}" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --notes "Standalone debug APK built by GitHub Actions (Run #${{ github.run_number }})." \
            --latest
